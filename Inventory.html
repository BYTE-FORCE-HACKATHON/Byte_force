    </div>

    <div style="position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); width: 100%; text-align: center; font-style: italic; font-size: 13.5px; color: rgba(255, 255, 255, 0.85); font-weight: 400; letter-spacing: 0.3px; pointer-events: none;">
        Empowering Kasi Businesses, One Transaction at a Time.
    </div>

<button onclick="window.location.href='Loginpage.html'" onmouseenter="this.style.backgroundColor='#ef4444'; this.style.color='#ffffff';" onmouseleave="this.style.backgroundColor='#ffffff'; this.style.color='#000000';" style="position: absolute; top: 20px; right: 20px; background: #ffffff; color: #000000; border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px 14px; font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); transition: background-color 0.2s ease, color 0.2s ease;" data-i18n="nav_signout">Sign Out</button>    </header>

</header>
    <!-- MOBILE MENU BUTTON -->

    <div class="menu-toggle" onclick="toggleMenu()">

        ☰

    </div>

    <!-- NAVIGATION -->

    <nav id="navbar">

        <p>

            <a href="Home.html">Home</a>

            <a href="Dashboard.html">Dashboard</a>

            <a href="Receipts.html">Receipts</a>

            <a href="Inventory.html" class="current">
                Inventory
            </a>

               <a href="Diagnostic.html">Diagnostics</a>
        </p>

    </nav>

    <!-- MAIN -->

    <main>

        <div class="inventory-container">

            <h2>Inventory Control</h2>

            <!-- PRODUCT SELECT -->

            <select id="productSelect">

                <option value="Tomato">Tomato</option>
                <option value="Tea">Tea</option>
                <option value="Toothpaste">Toothpaste</option>
                <option value="Towel">Towel</option>
                <option value="Apple">Apple</option>
                <option value="Bread">Bread</option>
                <option value="Milk">Milk</option>

            </select>

            <!-- QUANTITY -->

            <input
                type="number"
                id="quantityInput"
                placeholder="Enter quantity to add"
            >

            <!-- BUTTON -->

            <button onclick="updateInventory()">

                Update Inventory

            </button>

            <!-- INVENTORY DISPLAY -->

            <div
                class="inventory-list"
                id="inventoryList"
            >

            </div>

        </div>

    </main>

    <!-- FOOTER -->

    <footer>

        <p>
            Created by:
            <a href="">
                <!-- group -->
            </a>
        </p>

        <p>
            &copy; 2026 KasiPay by Byte Force
        </p>

    </footer>

</div>

<!-- INVENTORY SCRIPT -->

<script>

    // LOAD INVENTORY FROM STORAGE
    let inventory =
        JSON.parse(localStorage.getItem("inventory"));

    // FIRST TIME SETUP
    if(!inventory){

        inventory = [

            { name:"Tomato", price:15, stock:5 },
            { name:"Tea", price:45, stock:10 },
            { name:"Toothpaste", price:30, stock:4 },
            { name:"Towel", price:120, stock:3 },
            { name:"Apple", price:12, stock:8 },
            { name:"Bread", price:18, stock:5 },
            { name:"Milk", price:25, stock:6 }

        ];

        // SAVE DEFAULT INVENTORY
        localStorage.setItem(

            "inventory",

            JSON.stringify(inventory)

        );
    }

    // DISPLAY INVENTORY
    function displayInventory(){

        let inventoryList =
            document.getElementById("inventoryList");

        inventoryList.innerHTML = "";

        inventory.forEach(item => {

            inventoryList.innerHTML += `

                <div class="inventory-item">

                    <div>

                        <strong>${item.name}</strong>

                    </div>

                    <div class="stock">

                        Stock Left:
                        ${item.stock}

                    </div>

                </div>

            `;
        });
    }

    // SHOW INVENTORY ON PAGE LOAD
    displayInventory();

    // UPDATE INVENTORY
    function updateInventory(){

        let selectedProduct =
            document.getElementById("productSelect").value;

        let quantity =
            parseInt(
                document
                    .getElementById("quantityInput")
                    .value
            );

        // VALIDATION
        if(isNaN(quantity) || quantity <= 0){

            alert(
                "Please enter a valid quantity."
            );

            return;
        }

        // FIND PRODUCT
        let product =
            inventory.find(item =>
                item.name === selectedProduct
            );

        // ADD STOCK
        product.stock += quantity;

        // SAVE UPDATED INVENTORY
        localStorage.setItem(

            "inventory",

            JSON.stringify(inventory)

        );

        // REFRESH DISPLAY
        displayInventory();

        // CLEAR INPUT
        document.getElementById(
            "quantityInput"
        ).value = "";

        alert(

            quantity +
            " items added to " +
            selectedProduct

        );
    }

</script>

<!-- TOGGLE MENU -->

<script>

    function toggleMenu(){

        document
            .getElementById("navbar")
            .classList
            .toggle("show-nav");
    }

</script>

</body>
